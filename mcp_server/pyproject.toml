[project]
name = "claude-maps-mcp"
version = "0.1.0"
description = "MCP server bridging Claude to Google Maps Platform (Places New + Routes)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "playwright>=1.49",
    "html2text>=2024.2.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
